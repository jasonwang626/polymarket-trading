app:
  environment: development
  read_only: true
  log_level: INFO
  log_path: logs/scanner.jsonl

storage:
  sqlite_path: data/scanner.sqlite3

api:
  gamma_base_url: https://gamma-api.polymarket.com
  clob_base_url: https://clob.polymarket.com
  data_base_url: https://data-api.polymarket.com
  coinbase_base_url: https://api.exchange.coinbase.com
  kraken_base_url: https://api.kraken.com
  timeout_seconds: 12
  user_agent: polymarket-readonly-agent/0.1

scanner:
  refresh_seconds: 10
  discovery_refresh_seconds: 300
  market_page_size: 100
  market_max_pages: 5
  max_watchlist_size: 20
  max_concurrency: 8
  recent_trades_limit: 500
  external_price_stale_seconds: 30
  history_lookback_minutes: 20

filters:
  crypto_keywords:
    - bitcoin
    - btc
    - ethereum
    - ether
    - eth
    - crypto
  min_liquidity_usd: 1000
  min_volume_24h_usd: 100
  min_hours_to_expiry: 0.05
  max_hours_to_expiry: 168
  max_spread: 0.08

signals:
  min_orderbook_imbalance: 0.60
  max_orderbook_imbalance: 0.40
  min_momentum_5m: 0.005
  min_external_return_5m: 0.001
  min_signal_score: 2
